name: Z3-code Linux

on:
  push:
    branches:
      - feat/native-zeron
    paths:
      - 'native/zeron/**'
      - 'native/launch-t3'
      - 'native/connect-local.py'
      - 'native/test_connect_local.py'
      - 'native/test_webkit.py'
      - 'native/test_contracts.py'
      - '.github/workflows/native-t3-linux.yml'
  workflow_dispatch:
    inputs:
      check_upstream:
        description: Build against current upstream T3
        type: boolean
        default: false
  schedule:
    - cron: '15 4 * * *'

permissions:
  contents: write

concurrency:
  group: native-t3-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native/zeron
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      ORT_PREFER_DYNAMIC_LINK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check current upstream without changing the release branch
        if: github.event_name == 'schedule' || inputs.check_upstream
        run: |
          git config user.name 'Z3-code CI'
          git config user.email 'ci@users.noreply.github.com'
          git fetch https://github.com/pingdotgg/t3code.git main
          git merge --no-edit FETCH_HEAD

      - name: Local connection tests
        run: python3 -m unittest discover -s .. -p test_connect_local.py -v
      - name: Current T3 API contract
        run: python3 ../test_contracts.py -v
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev xvfb
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Embedded browser interaction and cookie isolation
        run: |
          cc crates/ui/src/browser/linux/helper.c -o "$RUNNER_TEMP/z3-webkit-check" $(pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.1 json-glib-1.0)
          xvfb-run -a python3 ../test_webkit.py "$RUNNER_TEMP/z3-webkit-check"
      - name: ONNX Runtime
        run: |
          curl --fail --location --retry 3 \
            https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz \
            --output "$RUNNER_TEMP/native-ort.tgz"
          printf '%s  %s\n' a5ed5a3cac51fbb2e90da632ae43d19212faaa20e76484e62bcb7c23ddb3b3fd "$RUNNER_TEMP/native-ort.tgz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/native-ort"
          tar -xzf "$RUNNER_TEMP/native-ort.tgz" -C "$RUNNER_TEMP/native-ort"
          native_ort_root="$RUNNER_TEMP/native-ort/onnxruntime-linux-x64-1.30.0"
          printf 'ORT_LIB_LOCATION=%s/lib\nNATIVE_ORT_ROOT=%s\n' "$native_ort_root" "$native_ort_root" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: native-t3-v1
          workspaces: native/zeron -> target
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Adapter tests
        run: cargo test --release --locked -p zeron-t3 --lib -j2
      - name: RPC response regressions
        run: cargo test --release --locked -p zeron-rpc --lib -j2
      - name: Integration clients
        run: cargo build --release --locked -p zeron-t3 --examples -j2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: z3-integration-client
          path: native/zeron/target/release/examples/features
          retention-days: 2
      - name: User bubble layout regression
        run: LD_LIBRARY_PATH="$ORT_LIB_LOCATION" cargo test --release --locked -p zeron-ui --lib user_bubbles_wrap_during_virtual_list_layout -j2
      - name: Question wizard regression
        run: LD_LIBRARY_PATH="$ORT_LIB_LOCATION" cargo test --release --locked -p zeron-ui --lib wizard_ -j2
      - name: Inline visual regression
        run: LD_LIBRARY_PATH="$ORT_LIB_LOCATION" cargo test --release --locked -p zeron-ui --lib only_dedicated_t3_visual_links -j2
      - name: Per-chat panel regression
        run: LD_LIBRARY_PATH="$ORT_LIB_LOCATION" cargo test --release --locked -p zeron-ui --lib session_panels_ -j2
      - name: Native desktop
        run: cargo build --release --locked -p zeron --bin zeron -j2
      - name: Separate preference paths
        run: LD_LIBRARY_PATH="$ORT_LIB_LOCATION" cargo test --release --locked -p zeron --bin zeron paths::tests -j2
      - name: Package Z3-code
        run: |
          native_bundle="$RUNNER_TEMP/z3-code-linux-x64"
          mkdir -p "$native_bundle/lib"
          cp target/release/zeron "$native_bundle/zeron"
          cp target/release/examples/smoke target/release/examples/exercise target/release/examples/sidebar target/release/examples/features "$native_bundle/"
          cp ../launch-t3 "$native_bundle/z3-code"
          cp ../connect-local.py "$native_bundle/connect-local.py"
          chmod +x "$native_bundle/z3-code"
          cp -a "$ORT_LIB_LOCATION/." "$native_bundle/lib/"
          cp LICENSE "$native_bundle/LICENSE-Zeron"
          cp ../../LICENSE "$native_bundle/LICENSE-T3"
          cp "$NATIVE_ORT_ROOT/LICENSE" "$native_bundle/LICENSE-ONNX-Runtime"
          cp "$NATIVE_ORT_ROOT/ThirdPartyNotices.txt" "$native_bundle/ONNX-ThirdPartyNotices.txt"
          cp ../README.md "$native_bundle/README.md"
          cp ../FEATURES.md "$native_bundle/FEATURES.md"
          printf '%s\n' "$GITHUB_SHA" > "$native_bundle/BUILD_COMMIT"
          sh -n "$native_bundle/z3-code"
          if env -u ZERON_T3_CONNECTION T3CODE_HOME="$RUNNER_TEMP/missing-native-t3-home" "$native_bundle/z3-code" --check; then
            echo 'Native launcher must reject a missing local T3 server' >&2
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/z3-code-linux-x64.tar.gz" -C "$RUNNER_TEMP" z3-code-linux-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: z3-code-linux-x64
          path: ${{ runner.temp }}/z3-code-linux-x64.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Publish tested Linux download
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/native-zeron'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          native_latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feat/native-zeron" --jq .object.sha)
          if [ "$native_latest_sha" != "$GITHUB_SHA" ]; then
            echo 'A newer build is queued; this tested version remains available as an artifact.'
            exit 0
          fi
          cd "$RUNNER_TEMP"
          sha256sum z3-code-linux-x64.tar.gz > z3-code-linux-x64.tar.gz.sha256
          gh release create "z3-code-${GITHUB_SHA:0:8}" \
            z3-code-linux-x64.tar.gz z3-code-linux-x64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Z3-code ${GITHUB_SHA:0:8}" \
            --notes 'Linux x64. Zeron native UI with the T3 Code backend. Start T3, then run z3-code.'
