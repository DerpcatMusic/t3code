name: Native T3 Linux

on:
  push:
    paths:
      - 'native/zeron/**'
      - 'native/launch-t3'
      - '.github/workflows/native-t3-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-t3-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native/zeron
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      ORT_PREFER_DYNAMIC_LINK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: ONNX Runtime
        run: |
          curl --fail --location --retry 3 \
            https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz \
            --output "$RUNNER_TEMP/native-ort.tgz"
          printf '%s  %s\n' a5ed5a3cac51fbb2e90da632ae43d19212faaa20e76484e62bcb7c23ddb3b3fd "$RUNNER_TEMP/native-ort.tgz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/native-ort"
          tar -xzf "$RUNNER_TEMP/native-ort.tgz" -C "$RUNNER_TEMP/native-ort"
          printf 'ORT_LIB_LOCATION=%s\n' "$RUNNER_TEMP/native-ort/onnxruntime-linux-x64-1.30.0" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/zeron -> target
          cache-on-failure: true
      - name: Adapter tests
        run: cargo test --release --locked -p zeron-t3 --lib -j2
      - name: Native desktop
        run: cargo build --release --locked -p zeron --bin zeron -j2
      - name: Separate preference paths
        run: cargo test --release --locked -p zeron --bin zeron paths::tests -j2
      - name: Integration clients
        run: cargo build --release --locked -p zeron-t3 --examples -j2
      - name: Package experimental client
        run: |
          native_bundle="$RUNNER_TEMP/native-t3-linux-x64"
          mkdir -p "$native_bundle/lib"
          cp target/release/zeron "$native_bundle/zeron"
          cp target/release/examples/smoke target/release/examples/exercise "$native_bundle/"
          cp ../launch-t3 "$native_bundle/native-t3"
          chmod +x "$native_bundle/native-t3"
          cp -a "$ORT_LIB_LOCATION/lib/." "$native_bundle/lib/"
          cp LICENSE "$native_bundle/LICENSE-Zeron"
          cp ../../LICENSE "$native_bundle/LICENSE-T3"
          cp "$ORT_LIB_LOCATION/LICENSE" "$native_bundle/LICENSE-ONNX-Runtime"
          cp ../README.md "$native_bundle/README.md"
          sh -n "$native_bundle/native-t3"
          if env -u ZERON_T3_CONNECTION "$native_bundle/native-t3" --version; then
            echo 'Native launcher must require a T3 connection' >&2
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/native-t3-linux-x64.tar.gz" -C "$RUNNER_TEMP" native-t3-linux-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-t3-linux-x64
          path: ${{ runner.temp }}/native-t3-linux-x64.tar.gz
          retention-days: 3
          if-no-files-found: error
